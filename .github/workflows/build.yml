name: Build Rubik Tangle

on:
  push:
      tags:
        - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 8
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'

      - name: Compile Java sources
        shell: bash
        run: |
          set -e

          mkdir -p build/classes deploy

          find src -type f -name '*.java' > build/sources.txt

          if [ ! -s build/sources.txt ]; then
            echo "No Java source files found in src/"
            exit 1
          fi

          javac -encoding UTF-8 \
            -classpath "lib/*" \
            -d build/classes \
            @build/sources.txt

      - name: Create JAR
        shell: bash
        run: |
          mkdir -p deploy build/classes/tangle
          cp -R images build/classes/tangle/
          #printf 'Main-Class: tangle.Layout\n\n' > deploy/MANIFEST.MF
          #cp MANIFEST.MF deploy/MANIFEST.MF
          jar cfm deploy/rubik-tangle.jar MANIFEST.MF \
            -C build/classes .
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: rubik-tangle-jar
          path: deploy/rubik-tangle.jar
          if-no-files-found: error
          retention-days: 30
